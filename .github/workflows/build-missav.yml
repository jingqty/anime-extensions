name: build-missav
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew :src:all:missav:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: missav
          path: src/all/missav/build/outputs/apk/**/*.apk
